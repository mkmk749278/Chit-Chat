# Android build pipeline (design §14.2, Requirement 10)
#
# Builds the signed release APK (for device/sideload testing) AND the signed
# Android App Bundle (AAB, for the Play Store) for the mobile app. This pipeline
# is scoped by path: it runs on push to `main` that touches `apps/mobile/**`
# (or shared packages / this workflow), and can also be triggered manually via
# workflow_dispatch (Req 10.1). It generates the native project from the Expo
# config via `expo prebuild`, then builds the signed APK + AAB as artifacts (no
# Play Store upload yet). The build job is SKIPPED until the signing secrets are configured
# (see the `config` gate below), so the pipeline stays green until release setup.
#
# To produce a build you must set these GitHub Secrets: ANDROID_KEYSTORE_BASE64,
# ANDROID_KEY_ALIAS, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_PASSWORD, and
# GOOGLE_SERVICES_JSON (base64-encoded). See docs/phase1-handoff.md.
#
# Every secret is sourced from GitHub Secrets and injected as an environment
# variable (Req 10.3). GitHub automatically masks registered secret values in
# log output, and no step ever echoes a secret (Req 10.4). The base64-encoded
# google-services.json and keystore are decoded into files at build time and
# are never printed.

name: android

on:
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "packages/**"
      - ".github/workflows/android.yml"
  # Allow on-demand builds (e.g. release cuts) without a code push.
  workflow_dispatch:

# Cancel superseded runs on the same ref so only the latest commit builds.
concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Gate: the signed build needs the Android signing keystore (and a native
  # Android project). Skip the build job — rather than fail it — when the
  # signing secrets are not configured, so the pipeline is green until the
  # mobile release setup is wired.
  # ---------------------------------------------------------------------------
  config:
    name: Resolve build configuration
    runs-on: ubuntu-latest
    outputs:
      signing_enabled: ${{ steps.flags.outputs.enabled }}
    steps:
      - name: Resolve signing flag
        id: flags
        run: echo "enabled=${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # Build + sign the release AAB and publish it as a workflow artifact.
  # All signing material comes from GitHub Secrets (Category C) and is decoded
  # to disk without ever being echoed (Req 10.3, 10.4).
  # ---------------------------------------------------------------------------
  build-android:
    name: Build and sign release APK + AAB
    runs-on: ubuntu-latest
    needs: config
    if: needs.config.outputs.signing_enabled == 'true'
    env:
      # Category B — Firebase config consumed by the Android build.
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      # Category C — Android signing material (auto-masked in logs).
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Java (Temurin 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      # Shared packages must compile before the mobile app can build.
      - name: Build shared packages
        run: npm run build:packages

      # Decode the base64 google-services.json secret to the path app.json's
      # `android.googleServicesFile` points at. It MUST exist before `expo
      # prebuild` so the @react-native-firebase/app config plugin wires the
      # google-services Gradle plugin into the generated project. Written straight
      # to a file, never printed (Req 10.4).
      - name: Write google-services.json
        run: |
          set -euo pipefail
          printf '%s' "$GOOGLE_SERVICES_JSON" | base64 --decode > apps/mobile/google-services.json

      # Generate the native Android project from the Expo config (app.json). This
      # is what creates `apps/mobile/android/` (Gradle project, package name,
      # Firebase wiring) — the repo intentionally does not commit the native
      # project. `--no-install` keeps the npm workspace install authoritative.
      # The GitHub ubuntu runner ships the Android SDK, so Gradle finds it via
      # ANDROID_HOME without an explicit SDK install step.
      - name: Generate native Android project (expo prebuild)
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --no-install

      # Decode the base64 release keystore secret to disk for signing, into the
      # app module created by prebuild. The decoded keystore is binary and is
      # never echoed (Req 10.4).
      - name: Write release keystore
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > apps/mobile/android/app/release.keystore

      # Build BOTH signed outputs from the same keystore:
      #   - assembleRelease -> a release .apk for sideloading / device testing
      #   - bundleRelease   -> the .aab for Play Store upload
      # Signing credentials are passed to Gradle as project properties sourced
      # from env (masked), never inlined or logged (Req 10.3, 10.4).
      - name: Build signed APK + AAB (gradlew assembleRelease bundleRelease)
        working-directory: apps/mobile/android
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew assembleRelease bundleRelease \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/apps/mobile/android/app/release.keystore" \
            -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"

      # Release APK — install this on a device to test before publishing.
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: apps/mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      # Release AAB — upload this to the Google Play Console.
      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: apps/mobile/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14

      # Remove decoded signing material from the runner workspace. Runners are
      # ephemeral, but we delete eagerly as defense in depth.
      - name: Clean up signing material
        if: always()
        run: |
          rm -f apps/mobile/android/app/release.keystore
          rm -f apps/mobile/google-services.json
          rm -f apps/mobile/android/app/google-services.json

  # ---------------------------------------------------------------------------
  # Publish the signed APK + AAB to the repo's Releases page so they have a
  # stable download link (instead of digging into per-run Actions artifacts).
  # Uses a single rolling pre-release tag (`android-latest`): each successful
  # build updates that release in place and replaces its assets, so the URL
  #   github.com/<owner>/<repo>/releases/tag/android-latest
  # always points at the newest build. It is marked a pre-release because the
  # app version is still 0.0.0 (pre-1.0). Switch to tag-driven versioned
  # releases (e.g. push `v1.0.0`) when you cut a real version.
  # ---------------------------------------------------------------------------
  release:
    name: Publish APK + AAB to Releases
    runs-on: ubuntu-latest
    needs: build-android
    # Least privilege: only this job may write releases/tags; the rest stay read-only.
    permissions:
      contents: write
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: app-release-apk
          path: release-assets

      - name: Download AAB artifact
        uses: actions/download-artifact@v4
        with:
          name: app-release-aab
          path: release-assets

      - name: Publish rolling pre-release (APK + AAB)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Lumin Chat (Android) — latest build
          prerelease: true
          # Don't flag this pre-release as the repo's "Latest release".
          make_latest: false
          body: |
            Automated Lumin Chat Android build.

            - **APK** (`app-release.apk`) — sideload to a device to test.
            - **AAB** (`app-release.aab`) — upload to the Google Play Console.

            Built from commit `${{ github.sha }}` (run `${{ github.run_id }}`).
          files: |
            release-assets/*.apk
            release-assets/*.aab

  # ---------------------------------------------------------------------------
  # Failure notification: surfaces a clear failure marker whenever the build
  # fails ("notify on failure", design §14.2).
  # ---------------------------------------------------------------------------
  notify-failure:
    name: Notify on failure
    runs-on: ubuntu-latest
    needs: [build-android, release]
    if: failure()
    steps:
      - name: Report failure
        run: |
          echo "::error::android pipeline failed for commit ${GITHUB_SHA} on ${GITHUB_REF}."
          {
            echo "## Android pipeline failed";
            echo "- Commit: \`${GITHUB_SHA}\`";
            echo "- Ref: \`${GITHUB_REF}\`";
            echo "- Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}";
          } >> "${GITHUB_STEP_SUMMARY}"
          exit 1
