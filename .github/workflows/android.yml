# Android build pipeline (design §14.2, Requirement 10)
#
# Builds the signed Android App Bundle (AAB) for the mobile app. This pipeline
# is scoped by path: it runs on push to `main` that touches `apps/mobile/**`
# (or shared packages / this workflow), and can also be triggered manually via
# workflow_dispatch (Req 10.1). Phase 0 wires the build only — the app itself is
# a skeleton — so there is no Play Store upload here, just a signed artifact.
#
# Every secret is sourced from GitHub Secrets and injected as an environment
# variable (Req 10.3). GitHub automatically masks registered secret values in
# log output, and no step ever echoes a secret (Req 10.4). The base64-encoded
# google-services.json and keystore are decoded into files at build time and
# are never printed.

name: android

on:
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "packages/**"
      - ".github/workflows/android.yml"
  # Allow on-demand builds (e.g. release cuts) without a code push.
  workflow_dispatch:

# Cancel superseded runs on the same ref so only the latest commit builds.
concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Build + sign the release AAB and publish it as a workflow artifact.
  # All signing material comes from GitHub Secrets (Category C) and is decoded
  # to disk without ever being echoed (Req 10.3, 10.4).
  # ---------------------------------------------------------------------------
  build-android:
    name: Build and sign release AAB
    runs-on: ubuntu-latest
    env:
      # Category B — Firebase config consumed by the Android build.
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      # Category C — Android signing material (auto-masked in logs).
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Java (Temurin 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      # Shared packages must compile before the mobile app can build.
      - name: Build shared packages
        run: npm run build:packages

      # Decode the base64 google-services.json secret into the Android app
      # module. The decoded value is written straight to a file and never
      # printed to the log (Req 10.4).
      - name: Write google-services.json
        run: |
          set -euo pipefail
          mkdir -p apps/mobile/android/app
          printf '%s' "$GOOGLE_SERVICES_JSON" | base64 --decode > apps/mobile/android/app/google-services.json

      # Decode the base64 release keystore secret to disk for signing. The
      # decoded keystore is binary and is never echoed (Req 10.4).
      - name: Write release keystore
        run: |
          set -euo pipefail
          mkdir -p apps/mobile/android/app
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > apps/mobile/android/app/release.keystore

      # Build the signed release AAB. Signing credentials are passed to Gradle
      # as project properties sourced from env (masked), never inlined or
      # logged (Req 10.3, 10.4). Replace with `eas build` if/when EAS is wired.
      - name: Build signed AAB (gradlew bundleRelease)
        working-directory: apps/mobile/android
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/apps/mobile/android/app/release.keystore" \
            -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: apps/mobile/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14

      # Remove decoded signing material from the runner workspace. Runners are
      # ephemeral, but we delete eagerly as defense in depth.
      - name: Clean up signing material
        if: always()
        run: |
          rm -f apps/mobile/android/app/release.keystore
          rm -f apps/mobile/android/app/google-services.json

  # ---------------------------------------------------------------------------
  # Failure notification: surfaces a clear failure marker whenever the build
  # fails ("notify on failure", design §14.2).
  # ---------------------------------------------------------------------------
  notify-failure:
    name: Notify on failure
    runs-on: ubuntu-latest
    needs: build-android
    if: failure()
    steps:
      - name: Report failure
        run: |
          echo "::error::android pipeline failed for commit ${GITHUB_SHA} on ${GITHUB_REF}."
          {
            echo "## Android pipeline failed";
            echo "- Commit: \`${GITHUB_SHA}\`";
            echo "- Ref: \`${GITHUB_REF}\`";
            echo "- Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}";
          } >> "${GITHUB_STEP_SUMMARY}"
          exit 1
