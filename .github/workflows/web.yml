# Web deploy pipeline (design §14.2, Requirement 10)
#
# On push to `main` touching `apps/web/**`, this pipeline runs the quality gate
# (lint -> typecheck -> tests -> Next.js build) in sequence and deploys the web
# service to the VPS ONLY if every gate step succeeds (Req 10.2). If any gate
# step fails, the `deploy` job never runs and the currently running deployment
# is left unchanged (Req 10.8). After deploy it polls the web `/health` route,
# retrying up to 5 times at 10s intervals; if it never reports healthy the run
# is marked failed (Req 10.7, 10.9).
#
# Every secret is sourced from GitHub Secrets and injected as an environment
# variable (Req 10.3). GitHub automatically masks registered secret values in
# log output, and no step ever echoes a secret (Req 10.4).

name: web

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "packages/**"
      - ".github/workflows/web.yml"

concurrency:
  group: web-deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Quality gate: lint -> typecheck -> tests -> build, in that order (Req 10.2).
  # Any failure fails this job and prevents `deploy` from running (Req 10.8).
  # ---------------------------------------------------------------------------
  build-and-test:
    name: Lint, typecheck, test, and build
    runs-on: ubuntu-latest
    outputs:
      # `true` only when the VPS deploy target is configured via secrets, so the
      # deploy job is skipped (not failed) on repos without infrastructure wired.
      deploy_enabled: ${{ steps.flags.outputs.enabled }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared packages
        run: npm run build:packages

      - name: Lint (ESLint)
        run: npm run lint --workspace=@chat-app/web --if-present

      - name: Typecheck (tsc)
        run: npm run typecheck --workspace=@chat-app/web --if-present

      - name: Test (Jest)
        run: npm run test --workspace=@chat-app/web --if-present

      - name: Build (Next.js)
        run: npm run build --workspace=@chat-app/web

      # Compute whether deploy is configured. Evaluates the secret to a boolean
      # (never prints its value), so the deploy job can be conditionally skipped.
      - name: Resolve deploy flag
        id: flags
        run: echo "enabled=${{ secrets.VPS_HOST != '' }}" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # Deploy: runs only after the quality gate succeeds (`needs`), satisfying the
  # "deploy only on success" requirement (Req 10.2) and leaving the running
  # deployment untouched on any gate failure (Req 10.8). It is also SKIPPED
  # (not failed) when the VPS deploy secrets are not configured, so a repo
  # without infrastructure wired shows a green pipeline rather than a red deploy.
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy web service to VPS and verify health
    runs-on: ubuntu-latest
    needs: build-and-test
    if: needs.build-and-test.outputs.deploy_enabled == 'true'
    env:
      # Category A — VPS access (secrets are auto-masked in logs).
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
      # Base domain; the web app is reachable at https://<DOMAIN>.
      DOMAIN: ${{ secrets.DOMAIN }}
    steps:
      - name: Configure SSH access
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      # Pull the new code and (re)build/start the web service.
      - name: Deploy web service
        run: |
          APP_DIR="${VPS_APP_DIR:-/opt/chit-chat}"
          ssh -i ~/.ssh/deploy_key "${VPS_USER}@${VPS_HOST}" \
            "set -euo pipefail \
             && cd '${APP_DIR}' \
             && git pull --ff-only \
             && cd infra/docker \
             && docker compose up --build -d web"

      # Verify the web app is serving via the public endpoint behind Caddy.
      # Up to 5 attempts at 10s intervals; non-zero exit fails the run when the
      # endpoint never reports healthy (Req 10.7, 10.9).
      - name: Verify health
        run: |
          HEALTH_URL="https://${DOMAIN}/health"
          for attempt in 1 2 3 4 5; do
            echo "Health check attempt ${attempt}/5: ${HEALTH_URL}"
            if curl -fsS --max-time 10 "${HEALTH_URL}" >/dev/null; then
              echo "Web deployment is healthy."
              exit 0
            fi
            if [ "${attempt}" -lt 5 ]; then
              echo "Not healthy yet; retrying in 10s."
              sleep 10
            fi
          done
          echo "::error::Web /health did not respond successfully after 5 attempts."
          exit 1

  # ---------------------------------------------------------------------------
  # Failure notification: surfaces a clear failure marker whenever the gate or
  # the deploy/health verification fails ("notify on failure", design §14.2).
  # ---------------------------------------------------------------------------
  notify-failure:
    name: Notify on failure
    runs-on: ubuntu-latest
    needs: [build-and-test, deploy]
    if: failure()
    steps:
      - name: Report failure
        run: |
          echo "::error::web pipeline failed for commit ${GITHUB_SHA} on ${GITHUB_REF}."
          {
            echo "## Web pipeline failed";
            echo "- Commit: \`${GITHUB_SHA}\`";
            echo "- Ref: \`${GITHUB_REF}\`";
            echo "- Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}";
          } >> "${GITHUB_STEP_SUMMARY}"
          exit 1
