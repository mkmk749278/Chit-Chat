<svg width="390" height="844" viewBox="0 0 390 844" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6D5EF7"/><stop offset="1" stop-color="#9B8CFA"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F4F3FF"/><stop offset="1" stop-color="#FBFBFE"/>
    </linearGradient>
  </defs>
  <rect width="390" height="844" rx="46" fill="url(#bg)"/>
  <!-- status bar -->
  <text x="28" y="40" font-size="14" font-weight="600" fill="#14141B">9:41</text>
  <text x="320" y="40" font-size="13" fill="#14141B">📶 🔋</text>

  <!-- logo -->
  <g transform="translate(195,150)">
    <circle r="44" fill="url(#brand)"/>
    <path d="M-12,-16 a12,12 0 1 1 0,0.01 M-12,-4 v18 h24 v-18 a12,12 0 0 0 -24,0" fill="none" stroke="#fff" stroke-width="3.5" stroke-linejoin="round"/>
    <circle cx="0" cy="6" r="3.5" fill="#fff"/>
  </g>
  <text x="195" y="232" text-anchor="middle" font-size="28" font-weight="800" fill="#14141B">Lumin Chat</text>
  <text x="195" y="258" text-anchor="middle" font-size="14" fill="#6B7280">Private, end‑to‑end encrypted messaging</text>

  <!-- phone field -->
  <text x="34" y="330" font-size="13" font-weight="600" fill="#3A3A45">Phone number</text>
  <rect x="30" y="344" width="92" height="52" rx="13" fill="#fff" stroke="#E6E5F2"/>
  <text x="46" y="376" font-size="16" font-weight="600" fill="#14141B">🇮🇳 +91</text>
  <text x="104" y="375" font-size="12" fill="#9AA0AC">▾</text>
  <rect x="130" y="344" width="230" height="52" rx="13" fill="#fff" stroke="#E6E5F2"/>
  <text x="146" y="376" font-size="16" fill="#14141B">96185 79123</text>

  <!-- button -->
  <rect x="30" y="416" width="330" height="54" rx="14" fill="url(#brand)"/>
  <text x="195" y="450" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">Send code</text>

  <!-- privacy note -->
  <rect x="30" y="500" width="330" height="92" rx="16" fill="#EEF6F0" stroke="#D5EBDB"/>
  <text x="50" y="530" font-size="15">🔒</text>
  <text x="74" y="528" font-size="13" font-weight="700" fill="#177A3B">End‑to‑end encrypted</text>
  <text x="74" y="550" font-size="12" fill="#3F6B4E">Messages are encrypted on your device.</text>
  <text x="74" y="568" font-size="12" fill="#3F6B4E">We can’t read them — and we don’t store them.</text>

  <text x="195" y="640" text-anchor="middle" font-size="11" fill="#9AA0AC">By continuing you agree to the Terms &amp; Privacy Policy</text>

  <!-- home indicator -->
  <rect x="150" y="822" width="90" height="5" rx="2.5" fill="#D7D7E0"/>
</svg>
